name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go build -race ./...
      # The client/server race test runs a real crush binary. Building it
      # here, outside go test, keeps a slow runner's build from eating the
      # package's test timeout (#429). Windows skips that test.
      - name: Prebuild the crush binary for the client/server race test
        if: runner.os != 'Windows'
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/crush-race" .
          echo "CRUSH_RACE_TEST_BIN=$RUNNER_TEMP/crush-race" >> "$GITHUB_ENV"
          echo "Prebuilt $RUNNER_TEMP/crush-race for internal/cmd/clientserverrace"
      - run: go test -race -failfast ./...
