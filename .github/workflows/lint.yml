name: lint
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Self-contained on purpose. This used to call
  # charmbracelet/meta/.github/workflows/lint.yml@main, which resolved to a
  # startup_failure in this fork — producing no check at all rather than a
  # red one, so lint silently stopped gating. A cross-repo reusable workflow
  # is also a ref this fork does not control: upstream can change it at any
  # time and the gate disappears again, without a diff here to explain why.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Mirrors the `lint:log` task.
      - name: Check log message capitalization
        run: ./scripts/check_log_capitalization.sh
      # Mirrors the `lint` task: same config, same flags, same pinned
      # golangci-lint version, so a local run and CI cannot disagree.
      # Built from source with the toolchain go.mod pins rather than taken
      # as a release binary: a binary built with an older Go cannot read
      # the export data of packages compiled by a newer one (the
      # "export data version N is greater than maximum supported" typecheck
      # failure), and go.mod's toolchain directive moves ahead of the
      # golangci-lint release cadence.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --path-mode=abs --config=.golangci.yml --timeout=10m ./...
      # schema.json is generated from the config types. The workflow that
      # used to regenerate and commit it on push is gone (CI gates PRs and
      # nothing else), so drift fails the PR instead: run `task schema`.
      - name: schema.json is current
        run: |
          go run . schema > schema.json
          git diff --exit-code -- schema.json
